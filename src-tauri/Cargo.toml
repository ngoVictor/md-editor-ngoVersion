[package]
name = "md-editor"
version = "0.1.0"
description = "A Tauri App"
authors = ["frandy820"]
edition = "2021"

[lib]
# `_lib` 后缀避免与 bin 同名冲突（Windows 上 cargo#8519）
name = "md_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
encoding_rs = "0.8"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"


tempfile = "3"

[target.'cfg(windows)'.dependencies]
webview2-com = "=0.38.2"
windows = { version = "=0.61.3", features = ["Win32_Foundation"] }

# Size-focused release, retaining normal panic unwinding and all desktop features.
# Dev/test profiles remain unchanged. Revalidate the actual release exe after changes.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = "symbols"
